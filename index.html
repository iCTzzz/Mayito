<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Para Mayito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #4a4442;
      --ink-soft: #8a8078;
      --gold: #c7a866;
      --paper: #fbfaf8;
      --line: rgba(199, 168, 102, 0.35);
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Lora', Georgia, serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .menu-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: clamp(28px, 6vh, 48px);
      max-width: 420px;
      width: 100%;
    }
    .menu-eyebrow {
      font-size: 12px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.8;
    }
    .menu-title {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 300;
      font-size: clamp(32px, 8vw, 48px);
      color: var(--ink);
      margin-top: 6px;
    }
    .menu-divider {
      width: 60px;
      height: 1px;
      background: var(--line);
    }
    .chapters {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }
    .chapter-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: clamp(20px, 5vw, 28px) 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      text-decoration: none;
      color: var(--ink);
      background: rgba(255,255,255,0.5);
      transition: border-color 0.3s, transform 0.2s, box-shadow 0.3s;
    }
    .chapter-link:hover,
    .chapter-link:active {
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(199,168,102,0.15);
    }
    .chapter-eyebrow {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .chapter-title {
      font-family: var(--font-display);
      font-style: italic;
      font-size: clamp(22px, 5vw, 28px);
    }
    .menu-footer {
      font-size: 13px;
      color: var(--ink-soft);
      font-style: italic;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="menu-wrap">
    <div>
      <p class="menu-eyebrow">AHORA HAY MENÚ CLARO Q SIIIIIIIIIIIIII</p>
      <h1 class="menu-title">para mi corazón muaki</h1>
    </div>

    <div class="menu-divider"></div>

    <div class="chapters">
      <!-- CAPÍTULO UNO: enlaza al sitio original, sin ningún cambio -->
      <a class="chapter-link" href="cap1.html">
        <span class="chapter-eyebrow">parte uno</span>
        <span class="chapter-title">capítulo 1: cálido y rojo</span>
      </a>

      <!-- CAPÍTULO DOS: enlaza a la nueva experiencia -->
      <a class="chapter-link" href="capitulo2.html">
        <span class="chapter-eyebrow">parte dos</span>
        <span class="chapter-title">capítulo 2: desde que...</span>
      </a>
    </div>

    <p class="menu-footer">aprietale al más nuevo jeje</p>
  </div>

</body>
</html>
